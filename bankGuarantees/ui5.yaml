specVersion: '2.4'
metadata:
  name: 'bankGuarantees'
type: application
server:
  settings:
    httpPort: 8085
  customMiddleware:
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /v2
    configuration:
      baseUri: "http://localhost:4004/v2"
      removeETag: true
builder:
  cachebuster:
    signatureType: time
  resources:
    excludes:
      - "/templates/**"
  customTasks:
    - name: ui5-task-cachebuster-indexing
      afterTask: generateVersionInfo
    - name: ui5-task-transpile
      afterTask: replaceVersion
      configuration:
        debug: false
        removeConsoleStatements: true
        transpileAsync: true
        excludePatterns:
        - "lib"
        - "libs"
        - "themes"
  bundles:
    - bundleDefinition:
        name: "com/bayer/tender/bankguarantees/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/bankguarantees/Component.js
              - com/bayer/tender/bankguarantees/manifest.json
              - com/bayer/tender/bankguarantees/webapp/controller/**
              - com/bayer/tender/bankguarantees/webapp/i18n/**
              - com/bayer/tender/bankguarantees/webapp/model/**
              - com/bayer/tender/bankguarantees/webapp/service/**
              - com/bayer/tender/bankguarantees/webapp/state/**
              - com/bayer/tender/bankguarantees/webapp/view/**
              - "!com/bayer/tender/bankguarantees/components/**"
              - "!com/bayer/tender/bankguarantees/libraries/**"
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/library-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/library.js
              - com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/manifest.json
              - com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/messagebyndle.properties
              - com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/controllers/**
              - com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/controls/**
              - com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/libs/**
              - com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/objects/**
              - com/bayer/tender/bankguarantees/libraries/uilib/src/com/bayer/tender/uilib/themes/**
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true